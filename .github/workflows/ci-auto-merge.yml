name: CI and auto-merge

on:
  push:
    branches:
      - "claude/**"
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (with placeholder env for validation only)
        working-directory: artifacts/next-onchain
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          NEXT_PUBLIC_ONCHAINKIT_API_KEY: ci-placeholder
        run: pnpm run build

      - name: Unit tests
        working-directory: artifacts/next-onchain
        run: pnpm run test

  auto-merge:
    name: Merge into main
    needs: test
    runs-on: ubuntu-latest
    # Only fast-forward-merge a claude/** branch into main once its own CI
    # passed on this exact commit. main's own pushes just run the test job
    # above and stop here.
    if: >
      success() &&
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      startsWith(github.ref, 'refs/heads/claude/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main "${GITHUB_REF_NAME}"
          git checkout main
          git merge --no-ff --no-edit "origin/${GITHUB_REF_NAME}" -m "Auto-merge ${GITHUB_REF_NAME} into main (CI passed)"
          git push origin main
